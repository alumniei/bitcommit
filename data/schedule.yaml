      role: "Data Scientist & Co-Founder"
      bio: "Liliana Antão is a researcher and Co-Founder of Medtiles, a startup developing AI-powered solutions to transform medical education, training and research. She is currently pursuing a PhD in Informatics Engineering at the Faculty of Engineering of University of Porto, where her research focuses on applying Artificial Intelligence and Robotics to improve collaboration between humans and machines. Liliana has over seven years of experience working at the intersection of AI, data science, and innovation - from research at the Digital and Intelligent Industry Lab (SYSTEC, FEUP), to consulting on AI strategy and R&D innovation at Deloitte, and developing AI products across industries at <a href=\"https://www.deus.ai/\" target=\"_blank\" rel=\"noopener noreferrer\">DEUS.ai</a>."
