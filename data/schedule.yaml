  title: "Round Table: Como a IA tem mudado o nosso trabalho"
  description: "Um grupo de especialistas irá discutir temas nos quais a IA tem tido impacto, como empregabilidade, saúde mental, pressão no trabalho, aprendizagem, entre outros."
  speaker_id: ""
  speakers_title: "Oradores"
  speakers_subtitle: "Conhece os especialistas que vão liderar a discussão."
  speakers:
    - name: "Emília Moreira"
      role: "Psychologist, Researcher"
      bio: "Emília Moreira é psicóloga e investigadora associada na Faculdade de Medicina da Universidade do Porto e no Laboratório Associado RISE-Health, com doutoramento em Geriatria e Gerontologia e mestrado em Saúde Pública. A sua investigação foca-se em doenças cardiocerebrovasculares, saúde mental e saúde digital, incluindo projetos de telemonitorização e realidade virtual, aplicando metodologias de investigação quantitativas e qualitativas.<br><br>Especializada em Psicologia Clínica e da Saúde, com especialização avançada em psicoterapia e psicogerontologia, pela Ordem dos Psicólogos Portugueses, atualmente, concilia a carreira académica com a prática clínica no Hospital Lusíadas Porto e na Clínica FMUP."
      image: "/images/speakers/emilia-moreira.png"
      linkedin: "https://www.linkedin.com/in/emilia-moreira-83565418"
    - name: "Liliana Antão"
      company: "Medtiles"
      role: "Data Scientist & Co-Founder"
      bio: "Liliana Antão é investigadora e cofundadora da Medtiles, uma startup que desenvolve soluções baseadas em IA para transformar a educação médica, a formação e a investigação. Encontra-se atualmente a realizar o doutoramento em Engenharia Informática na Faculdade de Engenharia da Universidade do Porto (FEUP), onde a sua investigação se foca na aplicação de Inteligência Artificial e Robótica para melhorar a colaboração entre humanos e máquinas. A Liliana conta com mais de sete anos de experiência na interseção entre IA, ciência de dados e inovação — desde a investigação no Digital and Intelligent Industry Lab (SYSTEC, FEUP), até à consultoria em estratégia de IA e inovação em I&D na Deloitte, e ao desenvolvimento de produtos de IA em vários setores na <a href=\"https://www.deus.ai/\" target=\"_blank\" rel=\"noopener noreferrer\">DEUS.ai</a>."
      image: "/images/speakers/liliana-antao.png"
      linkedin: "https://www.linkedin.com/in/lilianaantao"
    - name: "Ricardo Marques"
      role: "Career Coach"
      bio: "Licenciado em Relações Internacionais pela Universidade do Minho e pós-graduado em Gestão de Recursos Humanos pelo ISEG, Ricardo Marques construiu o seu percurso dentro das empresas, primeiro nos recursos humanos da adidas e depois no recrutamento, na Concentrix e na Uphold, onde decidiu quem avançava em processos para Portugal, Europa e Estados Unidos. Hoje está do outro lado da mesa. Como coach de carreira e criador de conteúdo, põe ao serviço dos candidatos aquilo que aprendeu enquanto os avaliava. Acredita que o mercado de trabalho continua a premiar quem sabe comunicar o seu valor, e que a IA está a mudar as regras desse jogo para quem contrata e para quem procura."
      image: "/images/speakers/ricardo-marques.jpeg"
      linkedin: "https://www.linkedin.com/in/ricardo-s-marques"
    - name: "Maria João Martins"
      company: "Siemens"
      role: "Moderadora"
      bio: "Engenheira biomédica de formação, com mestrado na área, Maria João Martins construiu a sua carreira em Data & AI. Na Siemens, concebe e desenvolve soluções de dados e IA, desde pipelines e modelos até insights práticos para equipas não técnicas. É cofundadora e líder do Young AI Leaders Community Viseu Hub, uma ONG registada no âmbito da rede AI for Good liderada pela União Internacional de Telecomunicações da ONU. O hub reúne mais de 35 voluntários, na sua maioria engenheiros e investigadores, para aproximar quem desenvolve IA das comunidades que esta impacta. Fá-lo através da conceção de soluções com parceiros locais para desafios reais da comunidade e de um programa gratuito de literacia em IA que já ajudou mais de 400 pessoas em sete instituições a compreender a tecnologia e a relacionar-se criticamente com ela. Acredita que a IA deve servir o bem social e ser construída com as pessoas, e não apenas para elas."
      image: "/images/speakers/maria-joao-martins.jpeg"
      linkedin: "https://www.linkedin.com/in/maria-joao-martins/"
    - name: "Luís Tavares"
      company: "SpaceXAI"
      role: "Software Engineer"
      bio: "Originalmente do Porto, vive agora em São Francisco onde é engenheiro na SpaceXAI e trabalha no Grok Bot. Antes disso, trabalhou em produtos de cloud e bases de dados na Databricks, Neon e SingleStore. Sempre teve um interesse especial por bases de dados e sistemas distribuídos. Mais recentemente, tem pensado bastante sobre a forma como a AI está a mudar não só a maneira como construímos software, mas também o que significa ser engenheiro de software."
      image: "/images/speakers/luis-tavares.png"
      linkedin: "https://www.linkedin.com/in/luis-tavares18"

