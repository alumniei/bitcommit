<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "pt-pt" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">

  <!-- Security & Canonical -->
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" type="image/png" href="{{ "images/mascot.png" | relURL }}">
  <link rel="apple-touch-icon" href="{{ "images/mascot.png" | relURL }}">

  <!-- Open Graph / Meta -->
  <meta property="og:title" content="{{ site.Title }}">
  <meta property="og:description" content="{{ site.Params.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.BaseURL }}">
  <meta property="og:image" content="{{ "/images/logo.png" | absURL }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Styles via Hugo Pipes -->
  {{ $style := resources.Get "css/style.css" | resources.Minify | resources.Fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">

  <!-- Scripts via Hugo Pipes -->
  {{ $script := resources.Get "js/main.js" | resources.Minify | resources.Fingerprint }}
  <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
</head>
<body>
  {{ partial "header.html" . }}
  <main id="content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
