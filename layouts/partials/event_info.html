<section class="section-event-info" id="local">
  <div class="container">
    <span class="section-kicker">Data e Local</span>
    <div class="event-info-grid">
      
      <!-- Local Card -->
      {{ if site.Params.location_maps_url }}
      <a href="{{ site.Params.location_maps_url }}" target="_blank" rel="noopener noreferrer" class="info-card info-card-link" aria-label="Abrir localização de {{ site.Params.location_venue }} no Google Maps">
        <div class="info-icon-wrapper" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <div class="info-card-text">
          <span class="info-label">Local</span>
          <span class="info-value">{{ site.Params.location_venue }}, {{ site.Params.location_city }}</span>
        </div>
        <div class="info-card-action" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </div>
      </a>
      {{ else }}
      <div class="info-card">
        <div class="info-icon-wrapper" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <div class="info-card-text">
          <span class="info-label">Local</span>
          <span class="info-value">{{ site.Params.location_venue }}, {{ site.Params.location_city }}</span>
        </div>
      </div>
      {{ end }}

      <!-- Hora Card -->
      <div class="info-card">
        <div class="info-icon-wrapper" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="info-card-text">
          <span class="info-label">Hora</span>
          <span class="info-value">{{ site.Params.event_time }}</span>
        </div>
      </div>

    </div>
  </div>
</section>
