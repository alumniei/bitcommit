<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Site.Title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: rgba(22, 27, 34, 0.8);
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 3rem 2rem;
      max-width: 600px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #79c0ff 0%, #d2a8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    p { color: #8b949e; font-size: 1.1rem; line-height: 1.6; margin-bottom: 2rem; }
    .badge {
      display: inline-block;
      background: #1f6feb22;
      color: #58a6ff;
      border: 1px solid #1f6feb66;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Coming Soon</div>
    <h1>{{ .Site.Title }}</h1>
    <p>{{ .Site.Params.description }}</p>
    <p><strong>Date:</strong> {{ .Site.Params.event_date_display }} | <strong>Location:</strong> {{ .Site.Params.location }}</p>
  </div>
</body>
</html>
